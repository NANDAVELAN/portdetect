[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portdetect"
version = "1.0.0"
description = "A developer diagnostics CLI that answers 'Who is using my port?'"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "NANDAVELAN SPS" }
]
keywords = ["networking", "ports", "developer-tools", "cli", "docker", "diagnostics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = [
    "psutil>=5.9.0",
]

[project.scripts]
portdetect = "portdetect:main"

[tool.setuptools]
py-modules = ["portdetect"]
